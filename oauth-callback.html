<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>rytmo. — login</title>
  <style>
    body { margin: 0; height: 100vh; display: grid; place-items: center; background: #050505; color: #f5f5f7; font-family: -apple-system, system-ui, sans-serif; text-align: center; }
    h1 { font-size: 40px; margin: 0 0 8px; } h1 b { color: #ff6b00; }
    p { color: #9d9daa; font-size: 16px; }
  </style>
</head>
<body>
  <div>
    <h1>rytmo<b>.</b></h1>
    <p id="msg">Conectando…</p>
  </div>
  <script>
    // Recebe o token do Google (no #fragmento).
    const query = location.hash.slice(1);
    const p = new URLSearchParams(query);
    const msg = document.getElementById('msg');
    history.replaceState(null, '', location.pathname);

    if ((p.get('state') || '').startsWith('web:')) {
      // iPhone/iPad: guarda o token e volta para o app.
      if (p.get('state') === localStorage.getItem('rytmo.oauthState') && p.get('access_token')) {
        const expiresAt = Date.now() + (Number(p.get('expires_in')) - 60) * 1000;
        const key = localStorage.getItem('rytmo.oauthKey') || 'rytmo.token';
        localStorage.setItem(key, JSON.stringify({ token: p.get('access_token'), expiresAt }));
      }
      const back = localStorage.getItem('rytmo.oauthReturn') || './';
      ['rytmo.oauthState', 'rytmo.oauthKey', 'rytmo.oauthReturn'].forEach((k) => localStorage.removeItem(k));
      location.replace(back);
    } else fetch('/__native/token?' + query) // app de Mac: entrega pelo servidor local

      .then(() => {
        msg.textContent = new URLSearchParams(query).get('error')
          ? 'O login foi cancelado. Volte ao rytmo. e tente de novo.'
          : 'Pronto! Você já pode fechar esta aba e voltar ao rytmo.';
      })
      .catch(() => { msg.textContent = 'Não foi possível falar com o app rytmo. Ele está aberto?'; });
  </script>
</body>
</html>
